name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generated code is up to date
        run: cargo xtask codegen --check
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  # 端到端：对真实 JDK 的源码做语料解析，并跑一遍 analysis-stats
  jdk:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        run: cargo build --release --package java-analyzer
      - name: Parse JDK sources
        run: |
          mkdir -p "$RUNNER_TEMP/jdk-src"
          unzip -q "$JAVA_HOME/lib/src.zip" 'java.base/*' -d "$RUNNER_TEMP/jdk-src"
          ./target/release/java-analyzer parse "$RUNNER_TEMP/jdk-src"
      - name: Formatter keeps tokens and is idempotent
        run: |
          cargo build --release --package evals
          ./target/release/ja-eval format-check "$RUNNER_TEMP/jdk-src"

  # 评测：场景集 + 以 javac 为标准答案的变异差分，对照 evals/baseline.json 防止退步
  evals:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: cargo build --release --package evals
      - name: Run evals
        run: ./target/release/ja-eval --json "$RUNNER_TEMP/evals.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report
          path: ${{ runner.temp }}/evals.json

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/code/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run package

  fuzz:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz parser (60s)
        run: cargo fuzz run parse -- -max_total_time=60
      - name: Fuzz incremental reparse (60s)
        run: cargo fuzz run reparse -- -max_total_time=60
